socket:
  # 显式配置优先；留空则默认使用 <exe_dir>/containerskill/host-cmd-bridge/hostcmd.sock
  path: ./containerskill/host-cmd-bridge/hostcmd.sock
  # 容器侧访问建议 0666；更严格可改 0660 并确保容器用户在同组
  file_mode: "0666"
http:
  listen_addr: ":8080"
  callback_path_prefix: "/wecom/callback"
  # 反向代理（Cloudflare Tunnel / nginx / frp 等）场景下还原真实客户端 IP。
  # 仅当直连对端命中该列表时才采信代理头，避免被伪造的 X-Forwarded-For 污染。
  # 支持 CIDR、裸 IP、以及关键字 loopback / private；默认仅回环（cloudflared 本机接入即可）。
  # 若 cloudflared 跑在容器里，直连对端是 docker 网关，需要显式加上，例如 172.17.0.1/32。
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
  # auto（默认）：按 CF-Connecting-IP -> True-Client-IP -> X-Real-IP -> X-Forwarded-For -> Forwarded 顺序挑选
  # 也可指定单个头：cf-connecting-ip / true-client-ip / x-real-ip / x-forwarded-for / forwarded
  real_ip_header: "auto"
store:
  sqlite_path: ./data/hostcmd.db
exec:
  max_concurrent: 2
  max_timeout_sec: 180
  run_user: hostcmd
approval:
  timeout_sec: 600
  callback_window_sec: 300
wecom:
  corp_id: "YOUR_CORP_ID"
  corp_secret: "YOUR_CORP_SECRET"
  agent_id: 1000002
  template_id: "YOUR_TEMPLATE_ID"
  creator_user_id: "zhangsan"
  approver_user_ids: ["lisi"]
  token: "YOUR_CALLBACK_TOKEN"
  encoding_aes_key: "YOUR_43_CHAR_AES_KEY"
  api_base_url: "https://qyapi.weixin.qq.com"
  field_titles:
    request_id: "请求ID"
    command: "执行命令"
    args: "命令参数"
    reason: "执行原因"
    timeout_sec: "超时时间(秒)"
    digest: "命令摘要"
policy:
  path: ./policy.example.yaml
  reload_interval_sec: 2
